name: aya_graphique
description: "Portfolio website for Aya's Graphique — Illustrator & Logo Designer."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Typography
  google_fonts: ^6.2.1

  # Scroll-reveal / entrance animations
  flutter_animate: ^4.5.0

  # Detects when a section scrolls into view, to trigger animations
  visibility_detector: ^0.4.0+2

  # Opens mailto / social links
  url_launcher: ^6.3.0

  # Supabase backend (auth, database, storage)
  supabase_flutter: ^2.6.0

  # Date formatting in the admin dashboard
  intl: ^0.19.0

  # Lets the admin dashboard upload images straight from the device
  file_picker: ^8.1.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
